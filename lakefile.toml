name = "queens_lean"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["QueensLean", "SecondLean"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0-rc1"

[[lean_lib]]
name = "QueensLean"

# The two exhaustive searches inside the kernel (Corollary 19 at n = 10 and 13). Not built by default:
# `lake build QueensLeanHeavy` needs about 21 GB of memory (C(10)) and about 10 h on one core (C(13)).
[[lean_lib]]
name = "QueensLeanHeavy"

# The plain-definition specification of paper 1 (Spec) and Theorem 5 in full (Paths), cited by paper 2 under these
# names. Paper 2's own files join this library at the paper-2 release.
[[lean_lib]]
name = "SecondLean"

name: build and check
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
          build: true
          test: false
          lint: false
      - name: Trust checks (sorry, axioms, listed theorems, spec boards)
        run: ./scripts/check.sh
      - name: leanchecker (kernel replay of every module)
        run: ./scripts/recheck.sh leanchecker
